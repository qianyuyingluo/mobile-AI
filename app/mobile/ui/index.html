<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self' data:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https:; base-uri 'none'; form-action 'none'">
  <title>mobile-AI</title>
  <link rel="icon" href="./assets/mobile-ai.svg">
  <link rel="stylesheet" href="./assets/design-platform.css">
  <link rel="stylesheet" href="./assets/picker/model-picker.css">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button type="button" id="open-sidebar" class="brand brand-icon-only" aria-label="打开会话与设置" aria-controls="sidebar" aria-expanded="false">
        <svg class="brand-gear" aria-hidden="true" width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox=".5 .5 15 15" fill="none" stroke-width="1"><path vector-effect="non-scaling-stroke" d="M8 9.75012C8.9665 9.75012 9.75 8.96662 9.75 8.00012C9.75 7.03362 8.9665 6.25012 8 6.25012C7.0335 6.25012 6.25 7.03362 6.25 8.00012C6.25 8.96662 7.0335 9.75012 8 9.75012Z" stroke="currentColor"></path><path vector-effect="non-scaling-stroke" d="M13.0107 7.79377C12.9505 7.89401 12.9205 7.94413 12.9205 7.99951C12.9205 8.0549 12.9505 8.10502 13.0106 8.20528L13.9849 9.83006C14.045 9.93029 14.0751 9.9804 14.0751 10.0358C14.0751 10.0911 14.045 10.1413 13.9849 10.2415L13.0037 11.8777C12.9468 11.9726 12.9184 12.0201 12.8725 12.0461C12.8267 12.072 12.7713 12.072 12.6607 12.072H10.6704C10.5598 12.072 10.5045 12.072 10.4586 12.098C10.4128 12.1239 10.3843 12.1714 10.3274 12.2662L9.33825 13.9142C9.28133 14.009 9.25287 14.0564 9.20703 14.0823C9.16118 14.1083 9.10588 14.1083 8.99529 14.1083H7.00486C6.89426 14.1083 6.83896 14.1083 6.79312 14.0823C6.74727 14.0564 6.71881 14.009 6.6619 13.9142L5.67273 12.2662C5.61581 12.1714 5.58735 12.1239 5.54151 12.098C5.49566 12.072 5.44036 12.072 5.32977 12.072H3.33945C3.2288 12.072 3.17347 12.072 3.12761 12.0461C3.08176 12.0201 3.0533 11.9726 2.9964 11.8777L2.0152 10.2415C1.9551 10.1413 1.92505 10.0911 1.92505 10.0358C1.92505 9.9804 1.9551 9.93029 2.0152 9.83006L2.98951 8.20528C3.04963 8.10502 3.07969 8.0549 3.07969 7.99951C3.07968 7.94413 3.04961 7.89401 2.98946 7.79377L2.01529 6.17011C1.95514 6.06987 1.92507 6.01975 1.92507 5.96437C1.92506 5.90899 1.95512 5.85886 2.01524 5.7586L2.9964 4.1224C3.0533 4.0275 3.08176 3.98005 3.12761 3.95408C3.17347 3.92811 3.2288 3.92811 3.33945 3.92811H5.32977C5.44036 3.92811 5.49566 3.92811 5.54151 3.90216C5.58735 3.87621 5.61581 3.82879 5.67273 3.73397L6.6619 2.08599C6.71881 1.99116 6.74727 1.94375 6.79312 1.9178C6.83896 1.89185 6.89426 1.89185 7.00486 1.89185H8.99529C9.10588 1.89185 9.16118 1.89185 9.20703 1.9178C9.25287 1.94375 9.28133 1.99116 9.33825 2.08599L10.3274 3.73397C10.3843 3.82879 10.4128 3.87621 10.4586 3.90216C10.5045 3.92811 10.5598 3.92811 10.6704 3.92811H12.6607C12.7713 3.92811 12.8267 3.92811 12.8725 3.95408C12.9184 3.98005 12.9468 4.0275 13.0037 4.1224L13.9849 5.7586C14.045 5.85886 14.0751 5.90899 14.0751 5.96437C14.0751 6.01975 14.045 6.06987 13.9849 6.17011L13.0107 7.79377Z" stroke="currentColor" stroke-miterlimit="10"></path></svg>

      </button>
      <nav id="draft-modes" class="mode-switch draft-modes" aria-label="新对话模式">
        <button type="button" id="chat-mode" aria-pressed="true">Chat</button>
        <button type="button" id="work-mode" aria-pressed="false">Work</button>
      </nav>
      <div class="topbar-actions">
        <button type="button" id="desktop-pair" class="control" hidden>手机配对</button>
        <button type="button" id="quick-new-session" class="quick-new" aria-label="新建对话" title="新建对话">＋</button>
      </div>
    </header>

    <section class="conversation" aria-label="对话">
      <div id="animation" hidden aria-hidden="true"></div>
      <div class="transcript" id="transcript" tabindex="0" aria-label="会话记录">
        <div id="thread" class="thread" role="log" aria-live="polite"></div>
      </div>
      <aside id="question-navigation" class="question-navigation" aria-label="对话进度" hidden>
        <div id="question-panel" class="question-panel" aria-hidden="true" inert>
          <div class="question-heading"><span>对话进度</span><button type="button" class="question-close" aria-label="收起对话进度">收起</button></div>
          <nav class="question-wheel" aria-label="问题目录，上下滑动转动"></nav>
          <div class="question-footer"><span class="question-count"></span><span>滑动查看 · 点击跳转</span></div>
        </div>
        <button type="button" class="question-handle" aria-label="展开对话进度" aria-controls="question-panel" aria-expanded="false"><span aria-hidden="true">→</span></button>
      </aside>
      <button type="button" id="scroll-bottom" class="scroll-bottom" aria-label="回到最新消息" title="回到最新消息" hidden>
        <span aria-hidden="true">↓</span>
      </button>
    </section>

    <footer class="message-dock">
      <p id="search-toast" class="search-toast" role="status" aria-live="polite" hidden></p>
      <div class="reply-status"><p id="status" class="status" role="status" aria-live="polite" hidden></p><button type="button" id="stop" class="control" hidden>停止</button></div>
      <form id="composer" class="composer">
        <div id="attachment-list" class="attachment-list" aria-label="待发送附件" hidden></div>
        <input id="file-input" type="file" multiple hidden>
        <label class="sr-only" for="prompt">消息</label>
        <div class="prompt-tools">
          <span id="composer-ready" class="composer-ready" role="img" aria-label="就绪" title="就绪" hidden></span>
          <button type="button" id="expand-prompt" class="prompt-expand" aria-label="展开输入框" title="展开输入框" aria-expanded="false" aria-controls="prompt"><svg aria-hidden="true"><use href="#dsw-icon-fullscreen-outline-regular"/></svg></button>
        </div>
        <textarea id="prompt" rows="1" maxlength="12000" placeholder="输入消息…" enterkeyhint="enter"></textarea>
        <div class="composer-actions" hidden>
          <button type="button" id="attach" class="control attach" aria-label="添加附件" title="添加附件">＋</button>
          <button type="button" id="web-search" class="control web-search" aria-label="联网搜索" aria-pressed="false" title="开启联网搜索"><svg width="24" height="24" aria-hidden="true"><use href="#dsw-icon-globe-outline-regular"/></svg></button>
          <div id="model-picker" class="composer-model"></div>
          <div id="work-effort" hidden></div>
          <button type="submit" id="send" class="action">发送</button>
        </div>
      </form>
    </footer>
  </main>

  <dialog id="sidebar" class="sidebar" aria-labelledby="sidebar-title">
    <div class="sidebar-header">
      <button type="button" class="brand" aria-label="收起会话侧边栏" data-close autofocus>
        <svg class="brand-gear" aria-hidden="true" width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox=".5 .5 15 15" fill="none" stroke-width="1"><path vector-effect="non-scaling-stroke" d="M8 9.75012C8.9665 9.75012 9.75 8.96662 9.75 8.00012C9.75 7.03362 8.9665 6.25012 8 6.25012C7.0335 6.25012 6.25 7.03362 6.25 8.00012C6.25 8.96662 7.0335 9.75012 8 9.75012Z" stroke="currentColor"></path><path vector-effect="non-scaling-stroke" d="M13.0107 7.79377C12.9505 7.89401 12.9205 7.94413 12.9205 7.99951C12.9205 8.0549 12.9505 8.10502 13.0106 8.20528L13.9849 9.83006C14.045 9.93029 14.0751 9.9804 14.0751 10.0358C14.0751 10.0911 14.045 10.1413 13.9849 10.2415L13.0037 11.8777C12.9468 11.9726 12.9184 12.0201 12.8725 12.0461C12.8267 12.072 12.7713 12.072 12.6607 12.072H10.6704C10.5598 12.072 10.5045 12.072 10.4586 12.098C10.4128 12.1239 10.3843 12.1714 10.3274 12.2662L9.33825 13.9142C9.28133 14.009 9.25287 14.0564 9.20703 14.0823C9.16118 14.1083 9.10588 14.1083 8.99529 14.1083H7.00486C6.89426 14.1083 6.83896 14.1083 6.79312 14.0823C6.74727 14.0564 6.71881 14.009 6.6619 13.9142L5.67273 12.2662C5.61581 12.1714 5.58735 12.1239 5.54151 12.098C5.49566 12.072 5.44036 12.072 5.32977 12.072H3.33945C3.2288 12.072 3.17347 12.072 3.12761 12.0461C3.08176 12.0201 3.0533 11.9726 2.9964 11.8777L2.0152 10.2415C1.9551 10.1413 1.92505 10.0911 1.92505 10.0358C1.92505 9.9804 1.9551 9.93029 2.0152 9.83006L2.98951 8.20528C3.04963 8.10502 3.07969 8.0549 3.07969 7.99951C3.07968 7.94413 3.04961 7.89401 2.98946 7.79377L2.01529 6.17011C1.95514 6.06987 1.92507 6.01975 1.92507 5.96437C1.92506 5.90899 1.95512 5.85886 2.01524 5.7586L2.9964 4.1224C3.0533 4.0275 3.08176 3.98005 3.12761 3.95408C3.17347 3.92811 3.2288 3.92811 3.33945 3.92811H5.32977C5.44036 3.92811 5.49566 3.92811 5.54151 3.90216C5.58735 3.87621 5.61581 3.82879 5.67273 3.73397L6.6619 2.08599C6.71881 1.99116 6.74727 1.94375 6.79312 1.9178C6.83896 1.89185 6.89426 1.89185 7.00486 1.89185H8.99529C9.10588 1.89185 9.16118 1.89185 9.20703 1.9178C9.25287 1.94375 9.28133 1.99116 9.33825 2.08599L10.3274 3.73397C10.3843 3.82879 10.4128 3.87621 10.4586 3.90216C10.5045 3.92811 10.5598 3.92811 10.6704 3.92811H12.6607C12.7713 3.92811 12.8267 3.92811 12.8725 3.95408C12.9184 3.98005 12.9468 4.0275 13.0037 4.1224L13.9849 5.7586C14.045 5.85886 14.0751 5.90899 14.0751 5.96437C14.0751 6.01975 14.045 6.06987 13.9849 6.17011L13.0107 7.79377Z" stroke="currentColor" stroke-miterlimit="10"></path></svg>
        <span id="sidebar-title">mobile-AI</span>
      </button>
      <button type="button" class="sidebar-icon" aria-label="收起侧边栏" title="收起侧边栏" data-close>×</button>
    </div>
    <button type="button" id="new-session" class="control sidebar-new">新会话</button>
    <div class="session-context" id="session-context"></div>
    <nav class="mode-switch" aria-label="会话列表">
      <button type="button" id="chat-history">聊天记录</button>
      <button type="button" id="work-history">电脑会话</button>
    </nav>
    <button type="button" id="open-library" class="control sidebar-settings" hidden>项目与工作区</button>
    <nav class="sidebar-history" aria-labelledby="sidebar-group">
      <h2 id="sidebar-group" class="sidebar-label">会话</h2>
      <p id="sidebar-project" class="sidebar-project"></p>
      <ul id="sidebar-sessions" class="sidebar-sessions"></ul>
      <p id="sidebar-empty" class="sidebar-label" hidden>还没有会话</p>
      <h2 id="recent-header" class="sidebar-label sidebar-recent" hidden>电脑端近期会话</h2>
      <ul id="recent-sessions" class="sidebar-sessions" aria-labelledby="recent-header"></ul>
      <p id="recent-empty" class="sidebar-label" hidden>当前项目暂无可续聊的电脑会话</p>
    </nav>
    <p id="sidebar-error" class="form-error" role="alert" hidden></p>
    <button type="button" id="oppo-live-updates" class="control" hidden>OPPO 实况通知</button>
    <button type="button" id="open-settings" class="control sidebar-settings">设置</button>
  </dialog>

  <dialog id="desktop-library" aria-labelledby="library-title">
    <div class="dialog-head">
      <button type="button" class="control" id="library-back" hidden>返回</button>
      <h2 id="library-title">项目与工作区</h2><button type="button" class="control" data-close>关闭</button>
    </div>
    <p id="library-status" class="form-error" role="status" hidden></p>
    <nav id="library-agents" class="mode-switch" aria-label="桌面软件">
      <button type="button" data-agent="codex">Codex</button>
      <button type="button" data-agent="deepseek">DeepSeek Harness</button>
    </nav>
    <div id="library-content"></div>
    <div id="library-tools" hidden>
      <button type="button" class="control" id="library-older">更早消息</button>
      <button type="button" class="control" id="library-latest">最新消息</button>
      <button type="button" class="control" id="library-resume">继续此对话</button>
    </div>
    <form id="library-composer" hidden>
      <textarea id="library-prompt" rows="3" placeholder="发送到电脑上的此对话" aria-label="发送到电脑原对话"></textarea>
      <button type="submit" class="control" id="library-send">发送</button>
    </form>
  </dialog>

  <dialog id="sources-sheet" class="sources-sheet" aria-labelledby="sources-title">
    <button type="button" class="sheet-handle" data-close aria-label="收起参考资料"><span></span></button>
    <div class="dialog-head"><h2 id="sources-title">参考资料</h2><button type="button" class="control" data-close autofocus>收起</button></div>
    <div id="sources-list" class="sources-list"></div>
  </dialog>

  <dialog id="image-viewer" class="image-viewer" aria-label="图片预览">
    <div class="viewer-toolbar"><span id="viewer-count"></span><button type="button" class="control" id="viewer-zoom">放大</button><button type="button" class="control" data-close>关闭</button></div>
    <div id="viewer-stage" class="viewer-stage"><img id="viewer-image" alt=""></div>
    <div class="viewer-footer"><button type="button" class="control" id="viewer-prev" aria-label="上一张图片">上一张</button><span id="viewer-name"></span><button type="button" class="control" id="viewer-next" aria-label="下一张图片">下一张</button></div>
  </dialog>

  <dialog id="delete-session" aria-labelledby="delete-session-title" aria-describedby="delete-session-description">
    <div class="dialog-head">
      <h2 id="delete-session-title">删除会话</h2>
    </div>
    <p id="delete-session-description" class="delete-session-description"></p>
    <div class="delete-session-actions">
      <button type="button" class="control" data-close autofocus>取消</button>
      <button type="button" id="confirm-delete" class="control danger">删除</button>
    </div>
  </dialog>

  <div id="model-settings"></div>
  <dialog id="chat-memory" aria-labelledby="memory-title">
    <div class="dialog-head"><h2 id="memory-title">Chat 记忆</h2><button type="button" class="control" data-close>关闭</button></div>
    <form id="memory-form" class="fields">
      <p>仅用于手机 Chat，不读取或同步 Work。开启后，全文随 Chat 请求发送给你选择的模型。</p>
      <label class="memory-toggle"><input id="memory-enabled" type="checkbox">开启文本记忆</label>
      <label for="memory-fixed">固定记忆 · 你来管理，AI 不修改</label>
      <textarea id="memory-fixed" rows="3" maxlength="1000" placeholder="例如：希望怎样称呼你、回答风格"></textarea>
      <label for="memory-auto">自动记忆 · 每行一条，最多 3000 字</label>
      <textarea id="memory-auto" rows="6" maxlength="3100" placeholder="模型只在有值得记住的信息时更新这里"></textarea>
      <p id="memory-count"></p>
      <details><summary>记忆来源</summary><ul id="memory-sources"></ul></details>
      <p id="memory-feedback" role="status"></p>
      <button type="submit" class="action">保存设置</button>
      <button type="button" id="memory-undo" class="control">撤销最近一次自动记忆修改</button>
      <button type="button" id="memory-clear" class="control danger">清空全部记忆</button>
      <div id="memory-clear-confirm" hidden>
        <p>清空固定和自动记忆，不删除聊天记录。清空后不可撤销。</p>
        <button type="button" id="memory-confirm-clear" class="control danger">确认清空</button>
        <button type="button" id="memory-cancel-clear" class="control">取消</button>
      </div>
    </form>
  </dialog>
  <dialog id="work-settings" aria-labelledby="work-settings-title">
    <div class="dialog-head">
      <h2 id="work-settings-title">电脑连接</h2>
      <button type="button" class="control" data-close>关闭</button>
    </div>
    <div id="work-connected" class="fields" hidden>
      <p id="linked-address"></p>
      <button id="disconnect" class="control full-width" type="button">退出连接</button>
    </div>
    <button id="scan-pair" class="control full-width" type="button" hidden>扫码连接</button>
    <form id="pair-form" class="fields">
      <label for="host">电脑地址</label>
      <input id="host" type="url" placeholder="http://192.168.1.10:8765" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label for="pair-code">配对码</label>
      <input id="pair-code" type="password" placeholder="电脑终端中显示的配对码" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p class="form-error" id="pair-error" role="alert" hidden></p>
      <button type="submit" id="pair-submit" class="action full-width">连接</button>
    </form>
  </dialog>

  <dialog id="scan-dialog" aria-labelledby="scan-title">
    <div class="dialog-head">
      <h2 id="scan-title">扫码连接</h2>
      <button type="button" class="control" data-close>关闭</button>
    </div>
    <video id="scan-preview" class="pair-visual" playsinline muted></video>
    <p id="scan-status" role="status"></p>
  </dialog>

  <dialog id="computer-pairing" aria-labelledby="computer-pair-title">
    <div class="dialog-head">
      <h2 id="computer-pair-title">手机扫码连接</h2>
      <button type="button" class="control" data-close>关闭</button>
    </div>
    <div class="fields">
      <label for="pair-addresses">电脑局域网地址</label>
      <select id="pair-addresses"></select>
      <img id="desktop-qr" class="pair-visual pair-qr" alt="手机配对二维码" hidden>
      <p id="desktop-pair-status" role="status"></p>
      <button type="button" id="new-qr" class="control">刷新二维码</button>
    </div>
  </dialog>

  <dialog id="agent-picker" aria-labelledby="agent-title">
    <div class="dialog-head">
      <h2 id="agent-title">选择 Work 助手</h2>
      <button type="button" class="control" data-close>关闭</button>
    </div>
    <div id="agent-options" class="agent-options"></div>
    <p class="form-error" id="agent-error" role="alert" hidden></p>
  </dialog>
</body>
</html>
